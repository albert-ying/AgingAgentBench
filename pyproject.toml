[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agingagentbench"
version = "0.1.0"
description = "Score analysis systems against published aging-clock effects"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT AND CC-BY-4.0 AND CC-BY-SA-4.0"}
authors = [{name = "Kejun Albert Ying"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agingagentbench = "agingagentbench.cli:main"

[tool.setuptools]
packages = ["agingagentbench", "agingagentbench.data", "agingagentbench.reference_results"]
package-dir = {"agingagentbench.data" = "data", "agingagentbench.reference_results" = "reference_results"}
license-files = ["LICENSE", "DATA_LICENSE.md"]

[tool.setuptools.package-data]
"agingagentbench.data" = ["*.jsonl", "*.json", "*.csv", "*.md", "**/*.jsonl", "**/*.json", "**/*.csv", "**/*.md"]
"agingagentbench.reference_results" = ["*.jsonl", "*.json", "*.csv", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
